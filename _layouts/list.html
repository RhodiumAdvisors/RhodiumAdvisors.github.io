---
layout: default
---

<div class="home">
    <div class="box-container">
        <div class="tab-box"><div class="wrapper">
            <button class="tab-links active" onclick="openTab(event, 'Properties')">Propriedades</button>
            <button class="tab-links" onclick="openTab(event, 'Buyers')">Compradores</button>
        </div></div>
        <div class="box tab-filters"><div class="wrapper">
            <input type="checkbox" id="filter-trigger" class="filter-trigger" />
            <label for="filter-trigger">
                <span class="menu-icon" style="display: none;">
                    <svg viewBox="0 -4.5 20 20" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="18px" height="15px"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <defs> </defs> <g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd"><g id="Dribbble-Light-Preview" transform="translate(-260.000000, -6684.000000)" fill="#fff"> <g id="icons" transform="translate(56.000000, 160.000000)"><path d="M223.707692,6534.63378 L223.707692,6534.63378 C224.097436,6534.22888 224.097436,6533.57338 223.707692,6533.16951 L215.444127,6524.60657 C214.66364,6523.79781 213.397472,6523.79781 212.616986,6524.60657 L204.29246,6533.23165 C203.906714,6533.6324 203.901717,6534.27962 204.282467,6534.68555 C204.671211,6535.10081 205.31179,6535.10495 205.70653,6534.69695 L213.323521,6526.80297 C213.714264,6526.39807 214.346848,6526.39807 214.737591,6526.80297 L222.294621,6534.63378 C222.684365,6535.03868 223.317949,6535.03868 223.707692,6534.63378" id="arrow_up-[#337]"> </path> </g> </g> </g> </g></svg>
                    Filters
                </span>
                <input type="text" id="searchBar" onkeyup="searchBar()" placeholder="Filtrar lista...">
            </label>
            <div class="filter">
                <div id="Properties_Filter" class="tab-filter" style="display:block;">
                    test property
                </div>
                
                <div id="Buyers_Filter" class="tab-filter">
                    test buyer
                </div>
            </div>
        </div></div>
        <div class="box tab-contents"><div class="list-wrapper">
            <div id="Properties" class="tab-content" style="display:block;">
                <div class="loading-text">A carregar Lista de Propriedades... </div><div class="loader"></div>
            </div>
            
            <div id="Buyers" class="tab-content">
                <div class="loading-text">A carregar Lista de Compradores... </div><div class="loader"></div>
            </div>
        </div></div>
    </div>
    <div id="SubmitForm" class="submit-form">
        <div class="submit-content">
            <div class="submit-header">
                <h2>Em breve!</h2>
            </div>
            <div class="submit-body">
                <p></p>
            </div>
            <div class="submit-footer">
            </div>
        </div>
    </div>
    <div class="submit-open">
        <h3 class="open"><span id="SubmitText">Submeter Propriedades</span> <span class="form-open">&plus;</span></h3>
    </div>
    <div id="Notification" class="notification">
        <div class="notification-content">
            <div class="notification-header">
                <span class="close">&times;</span>
                <h2></h2>
            </div>
            <div class="notification-body">
                <p></p>
            </div>
            <div class="notification-footer">
            </div>
        </div>
    </div>
</div>
<script src="/scripts/check_access.js"></script>
<script src="/scripts/tabs.js"></script>
<script src="/scripts/load_list.js"></script>
<script src="/scripts/filters.js"></script>
